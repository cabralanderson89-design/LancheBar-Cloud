services:
  - type: web
    name: lanchebar-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lanchebar-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: lanchebar-db
    plan: basic-256mb
